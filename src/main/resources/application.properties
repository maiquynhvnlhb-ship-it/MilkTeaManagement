# Application settings
spring.application.name=SpringMilkTea
server.port=8080

# Database profile
spring.profiles.active=prod

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/spring_milk_tea?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=VerySecretKeyForSpringMilkTeaJwtSigningVerySecret123
app.jwt.expiration-ms=86400000

# H2 console disabled
spring.h2.console.enabled=false