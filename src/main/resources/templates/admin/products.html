<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{admin/admin-layout :: layout}" th:with="title='Sản phẩm – Admin', pageTitle='Quản lý Sản phẩm'">
    <div th:fragment="content">
        
        <div class="admin-card">
            <div class="admin-card-header">
                <h5 class="admin-card-title">Danh sách Sản phẩm</h5>
                <a class="btn btn-primary btn-sm" th:href="@{/admin/products/new}"><i class="bi bi-plus-lg me-1"></i>Thêm sản phẩm</a>
            </div>
            
            <div class="table-responsive">
                <table class="table mb-0 table-hover align-middle">
                    <thead>
                        <tr>
                            <th width="5%">ID</th>
                            <th>Sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá bán</th>
                            <th>Loại</th>
                            <th>Trạng thái</th>
                            <th width="15%" class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td class="text-muted" th:text="${p.id}">1</td>
                            <td class="fw-semibold" th:text="${p.name}">Trà sữa</td>
                            <td><span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle" th:text="${p.category != null ? p.category.name : 'N/A'}">Danh mục</span></td>
                            <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</td>
                            <td>
                                <span th:if="${p.topping}" class="badge bg-info bg-opacity-10 text-info border border-info-subtle"><i class="bi bi-plus-circle me-1"></i>Topping</span>
                                <span th:unless="${p.topping}" class="badge bg-light text-dark border"><i class="bi bi-cup-straw me-1"></i>Đồ uống</span>
                            </td>
                            <td>
                                <span th:if="${p.status != null and p.status.name() == 'AVAILABLE'}" class="badge bg-success bg-opacity-10 text-success border border-success-subtle">Đang bán</span>
                                <span th:if="${p.status != null and p.status.name() == 'OUT_OF_STOCK'}" class="badge bg-danger bg-opacity-10 text-danger border border-danger-subtle">Hết hàng</span>
                                <span th:if="${p.status != null and p.status.name() == 'HIDDEN'}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle">Đang ẩn</span>
                                <span th:if="${p.status == null}" class="text-muted">N/A</span>
                            </td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary" th:href="@{|/admin/products/${p.id}/edit|}"><i class="bi bi-pencil me-1"></i>Sửa</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="7" class="text-center py-4 text-muted">Chưa có sản phẩm nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</body>
</html>
