<!DOCTYPE html>
<div th:replace="~{layout :: content}">
    <h2>Danh mục</h2>
    <a class="btn btn-success mb-3" th:href="@{/admin/categories/new}">Thêm danh mục</a>
    <table class="table table-striped">
        <thead>
            <tr><th>#</th><th>Tên</th><th>Mô tả</th><th>Hành động</th></tr>
        </thead>
        <tbody>
            <tr th:each="c,iterStat : ${categories}">
                <td th:text="${iterStat.index + 1}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.description}"></td>
                <td>
                    <a class="btn btn-sm btn-primary" th:href="@{|/admin/categories/${c.id}/edit|}">Sửa</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
