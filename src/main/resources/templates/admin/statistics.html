<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Thêm layout -->
</head>
<body>
<div th:replace="~{admin/admin-layout :: layout}" th:with="title='Thống kê – Admin', pageTitle='Báo cáo Thống kê'">
    <div th:fragment="content">
        
        <!-- MTD Metrics -->
        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="admin-card p-4 h-100" style="border-left: 4px solid #10b981;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="text-muted fw-semibold text-uppercase small" style="letter-spacing: 0.5px;">Doanh thu tháng này</div>
                        <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                            <i class="bi bi-cash-stack fs-4"></i>
                        </div>
                    </div>
                    <h2 class="mb-0 fw-bold"><span th:text="${#numbers.formatDecimal(monthRevenue, 0, 'COMMA', 0, 'POINT')}">0</span>đ</h2>
                    <div class="text-muted small mt-2">Tổng doanh thu từ đầu tháng đến nay</div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="admin-card p-4 h-100" style="border-left: 4px solid #3b82f6;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="text-muted fw-semibold text-uppercase small" style="letter-spacing: 0.5px;">Đơn hàng tháng này</div>
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                            <i class="bi bi-receipt fs-4"></i>
                        </div>
                    </div>
                    <h2 class="mb-0 fw-bold"><span th:text="${monthOrders}">0</span> <span class="fs-5 text-muted fw-normal">đơn</span></h2>
                    <div class="text-muted small mt-2">Tổng số đơn hàng đã tạo trong tháng</div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Biểu đồ doanh thu 7 ngày -->
            <div class="col-lg-8">
                <div class="admin-card h-100">
                    <div class="admin-card-header">
                        <h5 class="admin-card-title"><i class="bi bi-graph-up text-primary me-2"></i>Doanh thu 7 ngày gần nhất</h5>
                    </div>
                    <div class="p-4">
                        <canvas id="revenueChart" height="100"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- Top sản phẩm bán chạy -->
            <div class="col-lg-4">
                <div class="admin-card h-100">
                    <div class="admin-card-header">
                        <h5 class="admin-card-title"><i class="bi bi-trophy text-warning me-2"></i>Top bán chạy (30 ngày)</h5>
                    </div>
                    <div class="p-0">
                        <div class="list-group list-group-flush rounded-bottom">
                            <div class="list-group-item d-flex justify-content-between align-items-center p-3" th:each="prod, iter : ${topProducts}" th:if="${iter.index < 5}">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="fw-bold fs-5 text-muted" th:text="'#' + ${iter.count}" style="width: 24px;">#1</div>
                                    <div class="fw-semibold text-dark" th:text="${prod.name}">Trà sữa</div>
                                </div>
                                <span class="badge bg-primary rounded-pill px-3 py-2"><span th:text="${prod.quantity}">0</span> ly</span>
                            </div>
                            
                            <div th:if="${#lists.isEmpty(topProducts)}" class="p-4 text-center text-muted">
                                Chưa có dữ liệu bán hàng.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Script truyền dữ liệu từ Backend sang Frontend JS -->
        <script th:inline="javascript">
            /*<![CDATA[*/
            var chartLabels = /*[[${chartLabels}]]*/ ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            var chartData = /*[[${chartData}]]*/ [0, 0, 0, 0, 0, 0, 0];
            /*]]>*/
        </script>
        
        <!-- Include Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var ctx = document.getElementById('revenueChart').getContext('2d');
                
                // Tạo gradient cho biểu đồ line
                var gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)'); // primary color with opacity
                gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');
                
                var myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: 'Doanh thu (VNĐ)',
                            data: chartData,
                            backgroundColor: gradient,
                            borderColor: '#3b82f6',
                            borderWidth: 3,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#3b82f6',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            fill: true,
                            tension: 0.4 // Làm mượt đường line
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) {
                                            label += ': ';
                                        }
                                        if (context.parsed.y !== null) {
                                            label += new Intl.NumberFormat('vi-VN').format(context.parsed.y) + ' đ';
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: '#f1f5f9',
                                    drawBorder: false
                                },
                                ticks: {
                                    callback: function(value, index, values) {
                                        if(value >= 1000000) {
                                            return (value / 1000000) + 'Tr';
                                        }
                                        if(value >= 1000) {
                                            return (value / 1000) + 'k';
                                        }
                                        return value;
                                    }
                                }
                            },
                            x: {
                                grid: {
                                    display: false,
                                    drawBorder: false
                                }
                            }
                        }
                    }
                });
            });
        </script>
    </div>
</div>
</body>
</html>
