<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đơn hàng của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="staff-shell">
<div class="staff-page-simple">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Đơn hàng của tôi</h2>
            <div class="muted-small">Nhân viên: <span th:text="${username}">staff</span></div>
        </div>
        <div>
            <a class="btn btn-outline-secondary" th:href="@{/staff/pos}">Quay lại POS</a>
        </div>
    </div>

    <div class="table-responsive panel-card">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Mã đơn</th>
                <th>Trạng thái</th>
                <th>Tổng</th>
                <th>Ngày tạo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.orderCode}">OD000001</td>
                <td>
                    <span class="badge"
                          th:switch="${o.status.name()}">
                        <span th:case="'NEW'" class="badge text-bg-info">NEW - nhận đơn</span>
                        <span th:case="'PREPARING'" class="badge text-bg-warning">PREPARING - chuẩn bị</span>
                        <span th:case="'READY'" class="badge text-bg-primary">READY - sẵn sàng</span>
                        <span th:case="'PENDING'" class="badge text-bg-secondary">PENDING - đang giao</span>
                        <span th:case="'COMPLETED'" class="badge text-bg-success">COMPLETED - đã hoàn tất</span>
                        <span th:case="'CANCELED'" class="badge text-bg-danger">CANCELED - đã hủy</span>
                        <span th:case="*" class="badge text-bg-dark" th:text="${o.status}">UNKNOWN</span>
                    </span>
                </td>
                <td th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'">105,000đ</td>
                <td th:text="${o.createdAt}">2026-05-12</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
