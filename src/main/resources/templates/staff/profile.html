<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hồ sơ nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="staff-shell">
<div class="staff-page-simple">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Hồ sơ nhân viên</h2>
            <div class="muted-small">Tài khoản: <span th:text="${username}">staff</span></div>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/staff/pos}">Quay lại POS</a>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="panel-card p-3">
                <div class="fw-semibold mb-2">Thông tin tài khoản</div>
                <div>Username: <span th:text="${user != null ? user.username : ''}"></span></div>
                <div>Role: <span th:text="${user != null ? user.role : ''}"></span></div>
                <div>Trạng thái: <span th:text="${user != null ? user.enabled : ''}"></span></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="panel-card p-3">
                <div class="fw-semibold mb-2">Thông tin nhân viên</div>
                <div>Họ tên: <span th:text="${employee != null ? employee.fullName : ''}"></span></div>
                <div>SĐT: <span th:text="${employee != null ? employee.phone : ''}"></span></div>
                <div>Trạng thái: <span th:text="${employee != null ? employee.status : ''}"></span></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
