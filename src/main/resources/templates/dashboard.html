<div th:replace="layout :: layout" xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="mb-3">Xin chào, <span th:text="${username}">user</span></h2>
                        <p class="text-muted mb-4">Vai trò hiện tại: <strong th:text="${role}">ROLE</strong></p>

                        <div class="list-group">
                            <a class="list-group-item list-group-item-action" th:href="@{/staff/pos}">
                                Màn hình bán hàng (POS)
                            </a>
                            <a class="list-group-item list-group-item-action" th:href="@{/admin}">
                                Bảng quản trị (chỉ ADMIN)
                            </a>
                            <a class="list-group-item list-group-item-action" th:href="@{/auth/login}">
                                Trang đăng nhập
                            </a>
                            <a class="list-group-item list-group-item-action" th:href="@{/api/auth/login}">
                                API đăng nhập (POST)
                            </a>
                        </div>

                        <div class="mt-4">
                            <form th:action="@{/logout}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button class="btn btn-outline-danger" type="submit">Đăng xuất</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
