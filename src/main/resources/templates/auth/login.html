<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập – Milk Tea Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5e6d3 0%, #ffd6a0 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }
        .login-card .card-header {
            background: #48d874;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            border-radius: 16px 16px 0 0;
            padding: 1.25rem;
        }
        .btn-login {
            background: #003f0c;
            border: none;
            width: 100%;
            padding: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            background: rgba(70, 238, 89, 0.46);
        }
    </style>
</head>
<body>
    <div class="login-card card">
        <div class="card-header">🧋 Đăng nhập hệ thống</div>
        <div class="card-body p-4">
            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                Tài khoản hoặc mật khẩu không đúng.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
                Đăng xuất thành công.
            </div>
            <form th:action="@{/auth/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Tài khoản</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus />
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required />
                </div>
                <button type="submit" class="btn btn-login btn-primary">Đăng nhập</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
